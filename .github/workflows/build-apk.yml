name: Build Think Smaart APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Inject hidden Google Sheets sync key
        env:
          THINK_SMAART_SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('app/src/main/assets/web/index.html')
          text = p.read_text(encoding='utf-8')
          token = '__THINK_SMAART_SYNC_KEY__'
          key = os.environ.get('THINK_SMAART_SYNC_KEY', '')
          if token in text:
              if not key:
                  raise SystemExit('SYNC_KEY repository secret is missing')
              p.write_text(text.replace(token, key), encoding='utf-8')
              print('Hidden sync configuration injected')
          else:
              print('No sync placeholder found; continuing')
          PY
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Think-Smaart-Reminder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
