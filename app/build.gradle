plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thinksmaart.reminder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thinksmaart.reminder'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '14.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
